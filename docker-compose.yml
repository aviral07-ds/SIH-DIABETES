# syntax=docker/dockerfile:1
# ============================================================
# Docker Compose for local development
# ============================================================

services:
  dr-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: dr-screening-api:latest
    container_name: dr-screening-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
    volumes:
      - "./aptos final/test_images:/app/test_images:ro"
      - uploads:/app/uploads
    restart: unless-stopping
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  uploads: